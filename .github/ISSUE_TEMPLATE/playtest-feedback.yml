name: 试玩反馈或记录删除请求
description: 报告游戏问题、提交体验建议，或申请删除此前主动发送给维护者的测试记录
title: "[试玩反馈] "
labels:
  - playtest
body:
  - type: markdown
    attributes:
      value: |
        感谢参加《在答案之前》的早期测试。Issue 是公开页面，请勿粘贴完整测试 JSON、姓名、联系方式、公司或学校等个人信息。
  - type: dropdown
    id: request_type
    attributes:
      label: 反馈类型
      options:
        - 游玩问题或错误
        - 体验建议
        - 对数据说明有疑问
        - 删除此前主动发送的测试记录
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 原型版本
      description: 可在邀请页或导出的记录中查看。
      placeholder: 例如 v0.6
    validations:
      required: true
  - type: input
    id: run_id
    attributes:
      label: 匿名记录编号（仅删除请求需要）
      description: 只填写 runId，不要上传或粘贴完整 JSON。如果你从未把记录发送给维护者，则无需请求远程删除。
      placeholder: 例如 playtest-...
  - type: textarea
    id: details
    attributes:
      label: 发生了什么或希望怎样处理
      description: 请避免包含能识别你身份的信息。
      placeholder: 描述出现问题的场景、你的感受，或希望删除哪一份已发送记录。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有在此公开 Issue 中粘贴完整测试 JSON 或个人信息。
          required: true
